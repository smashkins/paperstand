name: Publish

on:
  push:
    tags: ['v*']

# Nothing at the workflow level; each job asks for exactly what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/smashkins/paperstand

jobs:
  # `tags: ['v*']` also fires for something like `vfoo`, which would build
  # nothing sensible yet still move a published tag. Stop before anything
  # builds, and before anything logs in to the registry.
  validate:
    name: Validate the release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF_NAME" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "'$REF_NAME' is not a vMAJOR.MINOR.PATCH[-prerelease] tag" >&2
            exit 1
          fi

  # One job per architecture, each on a runner of that architecture: no QEMU
  # anywhere. Emulating the arm64 half on an amd64 runner turned a build that
  # takes well under a minute natively into hours, because `npm ci`, the Vite
  # build and `uv sync` are all CPU-bound and every instruction was translated.
  #
  # Neither job tags anything. Each pushes an image addressed only by digest,
  # and `merge` assembles the two into the one manifest list that carries the
  # tags — the only way to get a multi-architecture tag out of separate runners.
  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checkout
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Name this platform for the artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. The tags belong to the manifest list and are applied once,
      # by `merge`. `org.opencontainers.image.source` is what links the package
      # to the repository on GHCR, and it comes from the action.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Paperstand
            org.opencontainers.image.description=Self-hosted reader for collections of PDF periodicals
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/smashkins/paperstand#readme
            org.opencontainers.image.vendor=smashkins

      # `scope` keeps the two architectures' caches apart; sharing one scope
      # makes each run evict the other's layers and neither ever warms up.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # An empty file named after the digest: the name is the whole payload.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push the manifest list
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No bare `{{major}}` while the project is 0.x, and no raw `latest`.
      # `latest=auto` moves `latest` only for a stable semver release, so a
      # `v0.2.0-rc.1` tag publishes itself and leaves `latest` where it was.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046  # both expansions are meant to word-split
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the manifest list
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

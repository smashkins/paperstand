name: Publish

on:
  push:
    tags: ['v*']

# Nothing at the workflow level; the one job asks for exactly what it needs.
permissions: {}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to GHCR
    steps:
      # `tags: ['v*']` also fires for something like `vfoo`, which would build
      # nothing sensible yet still move a published tag. Stop before the login.
      - name: Validate the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REF_NAME" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "'$REF_NAME' is not a vMAJOR.MINOR.PATCH[-prerelease] tag" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/smashkins/paperstand
          # No bare `{{major}}` while the project is 0.x, and no raw `latest`.
          # `latest=auto` moves `latest` only for a stable semver release, so a
          # `v0.2.0-rc.1` tag publishes itself and leaves `latest` where it was.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `org.opencontainers.image.{created,revision,source,url,version}` are
          # filled in by the action; these are the ones it cannot work out for
          # itself. `image.source` is what links the package to the repository
          # on GHCR, and it comes from the action.
          labels: |
            org.opencontainers.image.title=Paperstand
            org.opencontainers.image.description=Self-hosted reader for collections of PDF periodicals
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/smashkins/paperstand#readme
            org.opencontainers.image.vendor=smashkins

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

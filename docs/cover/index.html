<!doctype html>
<!--
  Source of docs/cover.png, the social-preview banner at the top of the README.

  Regenerate it with:

      npx playwright screenshot --viewport-size=1280,640 \
        "file://$PWD/docs/cover/index.html" docs/cover.png

  The palette is the light theme from frontend/src/app.css, and the covers are
  the fictional publications of the sample library, at the true broadsheet and
  A4 page ratios. Nothing here is a real title.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Paperstand</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500&display=swap"
		/>
		<style>
			:root {
				--bg: #f5f1ea;
				--surface: #fbf9f5;
				--ink: #17150f;
				--muted: #6b655a;
				--hairline: #e4ded3;
				--accent: #c8102e;
				--shade: rgb(23 21 15 / 0.08);
				--shade-deep: rgb(23 21 15 / 0.22);
			}

			* {
				box-sizing: border-box;
				margin: 0;
			}

			html,
			body {
				width: 1280px;
				height: 640px;
				overflow: hidden;
			}

			body {
				background: var(--bg);
				color: var(--ink);
				font-family: 'Inter', system-ui, sans-serif;
				display: grid;
				grid-template-rows: 1fr auto;
				align-items: center;
				padding-top: 6px;
				-webkit-font-smoothing: antialiased;
			}

			/* A hairline of kiosk red along the very top, like a masthead rule. */
			body::before {
				content: '';
				position: absolute;
				inset: 0 0 auto 0;
				height: 6px;
				background: var(--accent);
			}

			header {
				text-align: center;
				display: grid;
				gap: 14px;
				align-content: center;
			}

			h1 {
				font-family: 'Fraunces', Georgia, serif;
				font-variation-settings: 'opsz' 144;
				font-weight: 600;
				font-size: 78px;
				letter-spacing: -0.02em;
				line-height: 1;
			}

			h1 .stand {
				color: var(--accent);
			}

			.tagline {
				font-size: 21px;
				color: var(--muted);
				letter-spacing: 0.01em;
			}

			/* The covers stand on a full-bleed hairline: a shelf, not a row. */
			.shelf {
				position: relative;
				display: flex;
				justify-content: center;
				align-items: flex-end;
				gap: 24px;
				padding-bottom: 40px;
			}

			.shelf::after {
				content: '';
				position: absolute;
				left: 0;
				right: 0;
				bottom: 40px;
				height: 1px;
				background: var(--hairline);
			}

			.cover {
				position: relative;
				width: 178px;
				border-radius: 3px;
				box-shadow:
					0 1px 2px var(--shade),
					0 14px 26px -14px var(--shade-deep);
				display: grid;
				align-content: start;
				padding: 18px 14px;
				gap: 10px;
				overflow: hidden;
			}

			/* Broadsheet 1000×1400, A4 595×842 — the sample library's page boxes. */
			.cover.broadsheet {
				aspect-ratio: 1000 / 1400;
			}

			.cover.a4 {
				aspect-ratio: 595 / 842;
				width: 162px;
			}

			.cover .masthead {
				font-family: 'Fraunces', Georgia, serif;
				font-variation-settings: 'opsz' 48;
				font-weight: 700;
				font-size: 17px;
				line-height: 1.1;
				color: #17150f;
			}

			.cover .rule {
				height: 2px;
				background: rgb(23 21 15 / 0.55);
			}

			.cover .date {
				font-size: 9.5px;
				color: rgb(23 21 15 / 0.62);
				letter-spacing: 0.02em;
			}

			/* A few grey bars standing in for columns of type. */
			.cover .lines {
				display: grid;
				gap: 4px;
				margin-top: 4px;
			}

			.cover .lines i {
				display: block;
				height: 3px;
				border-radius: 1px;
				background: rgb(23 21 15 / 0.17);
			}

			.cover .lines i:nth-child(3n) {
				width: 72%;
			}

			.cover .lines i:nth-child(5n) {
				width: 84%;
			}
		</style>
	</head>

	<body>
		<header>
			<h1>Paper<span class="stand">stand</span></h1>
			<p class="tagline">Your newspapers and magazines, on one shelf</p>
		</header>

		<div class="shelf">
			<div class="cover broadsheet" style="background: #b7e3ea">
				<div class="masthead">Corriere del Ponte</div>
				<div class="rule"></div>
				<div class="date">8 Settembre 2026</div>
				<div class="lines">
					<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
				</div>
			</div>

			<div class="cover broadsheet" style="background: #b7eadc">
				<div class="masthead">La Gazzetta del Lago</div>
				<div class="rule"></div>
				<div class="date">8 Settembre 2026</div>
				<div class="lines">
					<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
				</div>
			</div>

			<div class="cover broadsheet" style="background: #b7eace">
				<div class="masthead">Il Mattutino</div>
				<div class="rule"></div>
				<div class="date">8 Settembre 2026</div>
				<div class="lines">
					<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
				</div>
			</div>

			<div class="cover broadsheet" style="background: #eab7c0">
				<div class="masthead">Cronaca 24 Pagine</div>
				<div class="rule"></div>
				<div class="date">8 Settembre 2026</div>
				<div class="lines">
					<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
				</div>
			</div>

			<div class="cover a4" style="background: #eab7ca">
				<div class="masthead">Orizzonte</div>
				<div class="rule"></div>
				<div class="date">n. 1655 · 6 Marzo 2026</div>
				<div class="lines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
			</div>

			<div class="cover a4" style="background: #eaccb7">
				<div class="masthead">L'Almanacco</div>
				<div class="rule"></div>
				<div class="date">n. 36 · 2026</div>
				<div class="lines"><i></i><i></i><i></i><i></i><i></i><i></i></div>
			</div>
		</div>
	</body>
</html>
